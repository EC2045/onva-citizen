<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONVA 国籍データベース</title>
  <meta property="og:title" content="ONVA 国籍データベース">
  <meta property="og:description" content="ONVA王国の国籍保有者一覧。種族・名前・言語・バイナリで検索可能。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ec2045.github.io/onva-citizen/">
  <meta property="og:image" content="https://ec2045.github.io/onva-s_creature/worwolf.png">
  <meta property="og:site_name" content="ONVA Kingdom">
  <meta property="og:locale" content="ja_JP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="src/style_a9d6210b.css">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="header-inner">
        <div>
          <div class="site-title">ONVA CITIZENSHIP REGISTRY</div>
          <h1>国籍データベース <span>v1.0</span></h1>
        </div>
        <div class="header-links">
          <a href="https://ec2045.github.io/onva/" target="_blank">▶ ONVA王国</a>
          <a href="https://ec2045.github.io/onva-s_creature/" target="_blank">▶ 生物図鑑</a>
          <a href="https://ec2045.github.io/" target="_blank">▶ World Portal</a>
        </div>
      </div>
    </header>

    <div class="search-area">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="検索...">
        <select id="speciesSelect"
          style="display:none; max-width:180px; background:var(--bg3); border:none; border-left:1px solid var(--border2); color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 14px; outline:none; cursor:pointer;">
          <option value="" style="background:var(--bg2);">すべての種族</option>
          <option value="バイナリ" style="background:var(--bg2);">バイナリ</option>
          <option value="ウォーウルフ" style="background:var(--bg2);">ウォーウルフ</option>
          <option value="ウォーキャット" style="background:var(--bg2);">ウォーキャット</option>
          <option value="人間" style="background:var(--bg2);">人間</option>
          <option value="ハーフ" style="background:var(--bg2);">ハーフ</option>
          <option value="不明" style="background:var(--bg2);">不明</option>
        </select>
        <select id="jobSelect"
          style="display:none; max-width:180px; background:var(--bg3); border:none; border-left:1px solid var(--border2); color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 14px; outline:none; cursor:pointer;">
          <option value="" style="background:var(--bg2);">すべての職業</option>
        </select>
      </div>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="name">名前</button>
        <button class="mode-btn" data-mode="species">種族</button>
        <button class="mode-btn" data-mode="binary">バイナリ</button>
        <button class="mode-btn" data-mode="job">職業</button>
        <button class="mode-btn" data-mode="family">身内</button>
        <button class="mode-btn" data-mode="lang">言語</button>
        <button class="mode-btn" data-mode="condition">条件</button>
      </div>
    </div>

    <div class="stats-bar" id="statsBar"></div>
    <div class="grid" id="grid"></div>
    <div class="no-results" id="noResults" style="display:none">// RECORD NOT FOUND //</div>
  </div>

  <footer>
    <a href="https://ec2045.github.io/onva/">ONVA KINGDOM</a> &nbsp;·&nbsp;
    <a href="https://ec2045.github.io/">ec2045.github.io</a> &nbsp;·&nbsp;
    <span>ONVA CENTRAL CITIZENSHIP REGISTRY</span>
  </footer>
  <script src="src/script_bf816082.js"></script>
<script defer src="https://ec2045.github.io/scripts/basic-i18n.js" data-ja="ONVA王国の国籍保有者名簿。種族・名前・言語・バイナリで検索可能な市民管理アーカイブ。" data-en="ONVA&#x27;s citizenship registry, searchable by species, name, language, and binary representation."></script>
</body>

</html>
